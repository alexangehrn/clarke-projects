<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clarke Projects | Art Advisory &amp; Collection Management NYC</title>
<meta name="description" content="New York art advisory and collection management for private and corporate collectors of modern, contemporary and emerging art. Led by Benjamin Clarke.">
<link rel="stylesheet" href="../assets/fonts.css">
<style>
:root{--paper:#D9E5EC;--paper-2:#E7EEF2;--ink:#151A1E;--graphite:#3F4B54;--film:#121416;--marker:#F4F6F7;--sky:#DBDBDD;
  --sans:'Jost','Futura','Helvetica Neue',Arial,sans-serif;--logo:'Cormorant Garamond',serif;--m:clamp(20px,4.4vw,64px)}
*{box-sizing:border-box}
html,body{margin:0}
body{font:400 17px/1.62 var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.logo{font-family:var(--logo);font-weight:300;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;white-space:nowrap;line-height:1}
.menu ul{list-style:none;margin:0;padding:0;display:flex;gap:28px}
.menu a{display:inline-block;padding-block:8px;text-decoration:none;font-size:15px;letter-spacing:.02em;
  background:linear-gradient(currentColor,currentColor) 0 calc(100% - 4px)/0 1px no-repeat;transition:background-size .35s ease}
.menu a:hover,.menu a:focus-visible{background-size:100% 1px}
.kicker{font:500 12px/1.4 var(--sans);letter-spacing:.16em;text-transform:uppercase;margin:0}
.skip{position:absolute;left:16px;top:-60px;background:var(--ink);color:#fff;padding:10px 14px;z-index:99;text-decoration:none}
.skip:focus{top:12px}
h1,p,figure{margin:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

body{background:var(--paper)}
.hd{position:fixed;inset:0 0 auto;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;padding:22px var(--m)}
.hd .logo{font-size:19px}
.home{--p:1;height:260svh;position:relative}
.stage{position:sticky;top:0;height:100svh;overflow:hidden}
.type{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:center;padding:0 var(--m);
  transform:translateY(calc((1 - var(--p)) * 0px));}
.h1{font-weight:300;letter-spacing:-.025em;line-height:.92;
  --a:clamp(52px,10.5vw,190px);--b:clamp(34px,4.2vw,68px);font-size:calc(var(--a) * (1 - var(--p)) + var(--b) * var(--p));
  max-width:calc(100% - var(--p) * 50%)}
.type .city{margin-bottom:22px;color:var(--graphite)}
.type .intro{max-width:30em;margin-top:28px;font-size:17px;color:var(--graphite);opacity:clamp(0,calc((var(--p) - .6) * 2.5),1);
  transform:translateY(calc((1 - var(--p)) * 30px))}
.print{position:absolute;z-index:2;width:clamp(260px,34vw,560px);
  left:calc(50% + min(1, var(--p) * 1.5) * 18vw);top:calc(8% + var(--p) * 42%);
  transform:translate(-50%,-50%) scale(calc(.14 + var(--p) * .86)) rotate(calc((1 - var(--p)) * -24deg));transform-origin:50% 50%}
.print img{box-shadow:0 30px 60px -30px rgba(21,26,30,.5)}
.print figcaption{margin-top:12px;font:300 13px/1.45 var(--sans);color:var(--graphite);opacity:clamp(0,calc((var(--p) - .75) * 4),1)}
.print figcaption em{display:block}
.cue{position:absolute;left:50%;bottom:28px;width:1px;height:56px;background:var(--ink);transform-origin:top;
  opacity:calc(1 - var(--p) * 3);animation:cue 1.8s ease-in-out infinite}
@keyframes cue{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
.js .home{--p:0}
@media (max-width:820px){
  .print{width:62vw;left:calc(72% - var(--p) * 22%);top:calc(22% + var(--p) * 46%)}
  .h1{max-width:100%}
  .type{justify-content:flex-start;padding-top:calc(96px + (1 - var(--p)) * 18vh)}
  .type .intro{font-size:15.5px}
}
@media (max-width:480px){.hd .logo{font-size:16px}.menu ul{gap:18px}.menu a{font-size:14px}}
@media (prefers-reduced-motion:reduce){.js .home{--p:1}.home{height:auto}.stage{position:relative;min-height:100svh}}

</style>
</head>
<body>
<a class="skip" href="#h1">Skip to content</a>
<header class="hd"><a class="logo" href="#home">Clarke Projects</a><nav class="menu" aria-label="Main"><ul><li><a href="#about">About</a></li><li><a href="#services">Services</a></li><li><a href="#contact">Contact</a></li></ul></nav></header>
<section class="home" id="home" aria-labelledby="h1">
  <div class="stage">
    <main class="type"><p class="kicker city">New York</p><h1 class="h1" id="h1">Art Advisory &amp; Collection Management</h1><p class="intro">Clarke Projects is a New York-based art advisory and collection management firm working with private and corporate collectors of modern, contemporary and emerging art.</p></main>
    <figure class="print" aria-labelledby="cap"><img src="../assets/siskind.jpg" width="937" height="937" alt="Black-and-white photograph by Aaron Siskind: a diver seen from below, suspended against a white sky, arms and legs thrown outward."><figcaption id="cap">Aaron Siskind<em>Pleasures and Terrors of Levitation</em></figcaption></figure>
    <span class="cue" aria-hidden="true"></span>
  </div>
</section>
<script>

(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.documentElement.classList.add('js');
  var home=document.getElementById('home'), t=false;
  function ease(x){return 1-Math.pow(1-x,3)}
  function f(){t=false;var r=home.getBoundingClientRect(),span=home.offsetHeight-innerHeight;
    var p=Math.min(1,Math.max(0,-r.top/span));home.style.setProperty('--p',ease(p).toFixed(4));}
  addEventListener('scroll',function(){if(!t){t=true;requestAnimationFrame(f)}},{passive:true});
  addEventListener('resize',f);f();
})();
</script>
</body>
</html>
