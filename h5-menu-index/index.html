<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clarke Projects | Art Advisory &amp; Collection Management NYC</title>
<meta name="description" content="New York art advisory and collection management for private and corporate collectors of modern, contemporary and emerging art. Led by Benjamin Clarke.">
<link rel="stylesheet" href="../assets/fonts.css">
<style>
:root{--paper:#D9E5EC;--paper-2:#E7EEF2;--ink:#151A1E;--graphite:#3F4B54;--film:#121416;--marker:#F4F6F7;--sky:#DBDBDD;
  --sans:'Jost','Futura','Helvetica Neue',Arial,sans-serif;--logo:'Cormorant Garamond',serif;--m:clamp(20px,4.4vw,64px)}
*{box-sizing:border-box}
html,body{margin:0}
body{font:400 17px/1.62 var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.logo{font-family:var(--logo);font-weight:300;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;white-space:nowrap;line-height:1}
.menu ul{list-style:none;margin:0;padding:0;display:flex;gap:28px}
.menu a{display:inline-block;padding-block:8px;text-decoration:none;font-size:15px;letter-spacing:.02em;
  background:linear-gradient(currentColor,currentColor) 0 calc(100% - 4px)/0 1px no-repeat;transition:background-size .35s ease}
.menu a:hover,.menu a:focus-visible{background-size:100% 1px}
.kicker{font:500 12px/1.4 var(--sans);letter-spacing:.16em;text-transform:uppercase;margin:0}
.skip{position:absolute;left:16px;top:-60px;background:var(--ink);color:#fff;padding:10px 14px;z-index:99;text-decoration:none}
.skip:focus{top:12px}
h1,p,figure{margin:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

body{background:var(--paper-2)}
.home{min-height:100svh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);}
.left{display:flex;flex-direction:column;padding:26px var(--m) 40px;min-height:100svh}
.left .logo{font-size:19px}
.lede{margin-top:auto;padding-top:48px}
.lede .city{color:var(--graphite)}
.h1{font-weight:400;font-size:clamp(18px,1.5vw,22px);line-height:1.3;margin-top:10px;letter-spacing:.01em}
.lede .intro{margin-top:14px;max-width:30em;font-weight:300;font-size:16px;color:var(--graphite)}
.big{margin-top:40px;border-top:1px solid rgba(21,26,30,.18)}
.big ul{display:block}
.big li{border-bottom:1px solid rgba(21,26,30,.18)}
.big a{display:flex;align-items:baseline;gap:clamp(14px,2vw,32px);padding:clamp(6px,1.2vh,14px) 0;background:none;
  font-weight:300;font-size:clamp(52px,7.6vw,128px);line-height:1;letter-spacing:-.03em;transition:transform .45s cubic-bezier(.2,.7,.2,1),color .3s}
.big a small{font:500 12px/1 var(--sans);letter-spacing:.16em;color:var(--graphite);transform:translateY(-.4em)}
.big a:hover,.big a:focus-visible{transform:translateX(18px)}
.right{position:relative;background:var(--ink);display:grid;place-items:center;padding:clamp(40px,6vw,96px)}
.right figure{width:100%;max-width:620px}
.right img{width:100%}
.right figcaption{margin-top:14px;display:flex;justify-content:space-between;gap:16px;font:300 13px/1.4 var(--sans);color:#C9D3D9;letter-spacing:.02em}
@media (max-width:900px){
  .home{grid-template-columns:1fr}
  .left{min-height:auto;display:contents}
  .left .logo{order:0;padding:22px var(--m) 0;display:block}
  .right{order:1;margin:22px 0 0;padding:28px var(--m) 24px}
  .lede{order:2;padding:32px var(--m) 0}
  .big{order:3;margin:32px var(--m) 48px}
  .big a{font-size:clamp(48px,15vw,84px)}
}

</style>
</head>
<body>
<a class="skip" href="#h1">Skip to content</a>
<section class="home" id="home" aria-labelledby="h1">
  <div class="left">
    <a class="logo" href="#home">Clarke Projects</a>
    <main class="lede"><p class="kicker city">New York</p><h1 class="h1" id="h1">Art Advisory &amp; Collection Management</h1><p class="intro">Clarke Projects is a New York-based art advisory and collection management firm working with private and corporate collectors of modern, contemporary and emerging art.</p></main>
    <nav class="menu big" aria-label="Main"><ul>
      <li><a href="#about"><small>01</small>About</a></li>
      <li><a href="#services"><small>02</small>Services</a></li>
      <li><a href="#contact"><small>03</small>Contact</a></li>
    </ul></nav>
  </div>
  <div class="right"><figure aria-labelledby="cap"><img src="../assets/siskind.jpg" width="937" height="937" alt="Black-and-white photograph by Aaron Siskind: a diver seen from below, suspended against a white sky, arms and legs thrown outward."><figcaption id="cap"><span>Aaron Siskind</span><em>Pleasures and Terrors of Levitation</em></figcaption></figure></div>
</section>
</body>
</html>
